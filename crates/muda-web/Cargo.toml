[package]
name = "muda-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser-first metadata eraser (Leptos, prerendered static site)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
muda-core.workspace = true
leptos = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_meta = { version = "0.8" }
axum = { version = "0.8", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
leptos_axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["macros", "rt"], optional = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
tower = { version = "0.5", features = ["util"], optional = true }
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "DataTransfer",
    "Document",
    "DragEvent",
    "Element",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "Url",
    "Window",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "dep:tower",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[package.metadata.leptos]
output-name = "muda-web"
# Resolved from the workspace root: <repo>/target/site.
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
# Debian's wasm-opt rewrites __wbindgen_externrefs onto the non-growable
# funcref table. Release then dies in the browser with
# "WebAssembly.Table.grow(): failed to grow table by 4" and never hydrates.
# cargo-leptos downloads a current binaryen; reference-types must be on.
wasm-opt-features = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-reference-types",
]
